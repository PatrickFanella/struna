name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install offline sandbox and media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ffmpeg unzip poppler-utils
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: node scripts/verify-wave-8.ts /tmp/struna-wave8-journey-evidence
      - run: node scripts/verify-audio-path.ts /tmp/struna-wave8-audio-evidence
      - run: node scripts/verify-visual-system.ts /tmp/struna-visual-evidence
      - run: node scripts/verify-practice-layout.ts /tmp/struna-reading-evidence
      - run: node scripts/verify-delete-account.ts /tmp/struna-delete-evidence
      - run: node scripts/verify-export.ts /tmp/struna-export-evidence
      - run: node scripts/verify-plan-apply.ts /tmp/struna-plan-apply-evidence
      - run: node scripts/verify-coach-context.ts /tmp/struna-coach-context-evidence
      - run: node scripts/verify-connect-ai.ts /tmp/struna-connect-ai-evidence
      - run: node scripts/verify-hosted-isolation.ts
      - run: node scripts/verify-hosted-practice.ts
      - run: node scripts/verify-hosted-practice.ts --without-bootstrap
      - run: node scripts/verify-contextual-help.ts /tmp/struna-help-evidence
      - run: node scripts/verify-guest.ts /tmp/struna-guest-evidence
      - run: node scripts/verify-wave-4.ts /tmp/struna-wave4-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-system-evidence
          path: |
            /tmp/struna-wave8-journey-evidence
            /tmp/struna-wave8-audio-evidence
            /tmp/struna-visual-evidence
            /tmp/struna-reading-evidence
            /tmp/struna-help-evidence
            /tmp/struna-guest-evidence
            /tmp/struna-wave4-evidence
            /tmp/struna-connect-ai-evidence
            /tmp/struna-delete-evidence
            /tmp/struna-export-evidence
            /tmp/struna-plan-apply-evidence
            /tmp/struna-coach-context-evidence
          if-no-files-found: ignore
